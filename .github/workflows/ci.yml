name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npm run lint

      - name: Tests unitaires métier et couverture des cœurs
        run: npm run test:coverage

      - name: Tests Supabase Phase 0 (PGlite)
        run: npm run test:phase0

      - name: Build de production
        run: npm run build

  e2e:
    name: Smoke tests navigateur
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer les smoke tests
        run: npm run test:e2e

      - name: Publier les traces en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
